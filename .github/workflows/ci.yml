name: CI

on:
  # Manual dispatch runs only Windows; automatic checks include macOS recording.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  javascript:
    if: github.event_name != 'workflow_dispatch'
    name: JavaScript (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint and types
        run: ./bin/pnpm check
      # check already ran TypeScript; do not repeat pnpm build's typecheck.
      - name: Frontend build
        run: ./bin/pnpm exec vite build
      - name: Vitest shard
        env:
          # Bound contention between suites that sign and verify large fixtures.
          BUZZ_TEST_WORKERS: "2"
        run: ./bin/node scripts/ci-test-report.mjs kind=vitest report=test-results/ci/vitest.json evidence=test-results/ci/vitest-timing.json title="Vitest shard ${{ matrix.shard }}/2" -- ./bin/pnpm exec vitest run --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile=test-results/ci/vitest.json
      - name: Vitest timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-timing-${{ matrix.shard }}
          path: test-results/ci
          retention-days: 7

  native:
    if: github.event_name != 'workflow_dispatch'
    name: Rust and tool integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-daemon libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native
          save-if: ${{ github.event_name == 'push' }}
      - name: Rust formatting
        run: ./bin/cargo fmt --all --check
      - name: Rust lint
        run: ./bin/cargo clippy --workspace --locked --all-targets -- -D warnings
      # --workspace includes Tauri, unlike the default Cargo member selection.
      - name: All Rust tests and doctests
        run: ./bin/cargo test --workspace --locked
      - name: All Node integration tests
        run: ./bin/node --test tests/integration/*.test.mjs

  windows-native:
    if: github.event_name == 'workflow_dispatch'
    name: Windows native validation
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Hermit does not run on Windows. Use the same repository Rust pin with
      # the hosted runner's standard rustup, not a second floating toolchain.
      - name: Select pinned Rust
        shell: pwsh
        run: |
          $pins = @(Get-ChildItem bin/.rust-*.pkg)
          if ($pins.Count -ne 1) { throw "Expected exactly one repository Rust pin" }
          $version = $pins[0].Name -replace '^\.rust-(.*)\.pkg$', '$1'
          rustup toolchain install $version --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$version" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native lint including Windows backend
        run: cargo clippy -p buzz-foundation -p buzz-agent-controller -p buzz-credential-store --locked --all-targets -- -D warnings
      - name: All native package tests
        run: cargo test -p buzz-foundation -p buzz-agent-controller -p buzz-credential-store --locked --no-fail-fast

  measurements:
    if: github.event_name != 'workflow_dispatch'
    name: Browser measurements
    runs-on: ubuntu-24.04
    # Match package.json's Playwright version and pin immutable browser/OS layers.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      HOME: /root
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Trust this container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      # Preserve Chromium -> WebKit measurement dependencies; never shard or
      # overlap the two measurement projects on this runner.
      - name: Serial Chromium and WebKit measurements
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser/ci-report.json
        run: ./bin/node scripts/ci-test-report.mjs kind=playwright report=test-results/browser/ci-report.json evidence=test-results/browser/ci-timing.json title="Browser measurements" -- ./bin/pnpm test:browser:ci --project '*-measurements' --workers=1 --reporter=list,json
      # Cases tagged @classic-scrollbars need Chromium's platform scrollbars,
      # which Linux always draws as classic ones. One file cannot join the
      # six-way engine matrix (empty shards are errors), so it runs here, and
      # CI required already blocks on this job. The project writes to its own
      # outputDir so this run does not clear the measurement evidence above.
      - name: Chromium classic-scrollbar layout
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser-classic-scrollbars/ci-report.json
        run: ./bin/node scripts/ci-test-report.mjs kind=playwright report=test-results/browser-classic-scrollbars/ci-report.json evidence=test-results/browser-classic-scrollbars/ci-timing.json title="Browser classic scrollbars" -- ./bin/pnpm test:browser:ci --project chromium-classic-scrollbars --no-deps --reporter=list,json
      - name: Measurement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-measurements
          path: |
            test-results/browser
            test-results/browser-classic-scrollbars
          retention-days: 7

  browser_fixture:
    if: github.event_name != 'workflow_dispatch'
    name: Native browser fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.fixture-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: browser-fixture
          save-if: ${{ github.event_name == 'push' }}
      - name: Build native browser fixture
        timeout-minutes: 8
        run: ./bin/cargo build --locked -p buzzodz-plugins --example fixture-bridge --target-dir target/browser-fixture
      - name: Package same-revision native fixture
        run: |
          mkdir -p target/browser-artifact
          cp target/browser-fixture/debug/examples/fixture-bridge target/browser-artifact/
          git rev-parse HEAD > target/browser-artifact/revision
          cd target/browser-artifact
          sha256sum fixture-bridge > SHA256SUMS
          tar -cf ../browser-fixture.tar fixture-bridge revision SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: fixture-upload
        with:
          name: browser-fixture-${{ github.sha }}-${{ github.run_attempt }}
          path: target/browser-fixture.tar
          if-no-files-found: error
          retention-days: 1

  browser:
    if: github.event_name != 'workflow_dispatch'
    name: Browser journeys (${{ matrix.engine }}, ${{ matrix.shard }}/6)
    # Measurements stay isolated on their own runner, not on our critical path.
    # CI required still requires their success independently of these jobs.
    needs: [browser_fixture]
    runs-on: ubuntu-24.04
    # Match package.json's Playwright version and pin immutable browser/OS layers.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      HOME: /root
      BUZZ_BROWSER_FIXTURE_DIR: target/ci-browser-fixture
    # Six file-level shards split the large file groups that remain together
    # with four or five shards, leaving room for setup inside the same deadline.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Trust this container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
          browser-engine: ${{ matrix.engine }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.browser_fixture.outputs.artifact-id }}
          merge-multiple: true
          path: target/ci-browser-fixture
      - name: Verify native browser fixture
        run: |
          cd target/ci-browser-fixture
          tar -xf browser-fixture.tar
          test "$(cat revision)" = "$(git rev-parse HEAD)"
          sha256sum --check SHA256SUMS
          test -x fixture-bridge
      # CI required enforces measurement success. --no-deps avoids repeating
      # measurements here; the matrix covers both engines on separate runners.
      - name: Functional journeys
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser/ci-report.json
        run: ./bin/node scripts/ci-test-report.mjs kind=playwright report=test-results/browser/ci-report.json evidence=test-results/browser/ci-timing.json title="Browser journeys (${{ matrix.engine }}, ${{ matrix.shard }}/6)" -- ./bin/pnpm test:browser:ci --project ${{ matrix.engine }} --no-deps --shard=${{ matrix.shard }}/6 --reporter=list,json
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-journeys-${{ matrix.engine }}-${{ matrix.shard }}
          path: test-results/browser
          retention-days: 7

  media_recorder:
    if: github.event_name != 'workflow_dispatch'
    name: WebKit recording (macOS)
    # Playwright disables ENABLE_MEDIA_RECORDER in its GTK/WPE builds.
    # Keep the real recorder and every assertion on the supported WebKit host.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned WebKit
        run: ./bin/pnpm exec playwright install webkit
      - name: Recording journeys
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser/ci-report.json
        run: ./bin/node scripts/ci-test-report.mjs kind=playwright report=test-results/browser/ci-report.json evidence=test-results/browser/ci-timing.json title="WebKit recording (macOS)" -- ./bin/pnpm test:browser --project webkit --grep @media-recorder --no-deps --reporter=list,json
      - name: Recording evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-media-recorder-webkit
          path: test-results/browser
          retention-days: 7

  required:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Automatic CI (not requested)' || 'CI required' }}
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [javascript, native, measurements, browser_fixture, browser, media_recorder]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every lane and every shard
        env:
          JAVASCRIPT: ${{ needs.javascript.result }}
          NATIVE: ${{ needs.native.result }}
          MEASUREMENTS: ${{ needs.measurements.result }}
          FIXTURE: ${{ needs.browser_fixture.result }}
          BROWSER: ${{ needs.browser.result }}
          MEDIA_RECORDER: ${{ needs.media_recorder.result }}
        run: |
          for result in "$JAVASCRIPT" "$NATIVE" "$MEASUREMENTS" "$FIXTURE" "$BROWSER" "$MEDIA_RECORDER"; do
            test "$result" = success || exit 1
          done
