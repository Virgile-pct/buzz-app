[package]
name = "buzzodz-plugins"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "buzzodz"
path = "src/main.rs"

[build-dependencies]
dotenvy = "0.15"
url = "2"

[dev-dependencies]
dotenvy = "0.15"

[dependencies]
bech32 = "0.12"
buzz-credential-store = { path = "../credential-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
tempfile = "3"
url = "2"
cap-std = "4"
nostr = { version = "=0.45.5", default-features = false, features = ["std", "os-rng"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
