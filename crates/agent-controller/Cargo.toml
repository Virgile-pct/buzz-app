[package]
name = "buzz-agent-controller"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dev-dependencies]
tempfile = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
hmac = "0.13"
base64 = "0.23"
nostr = { version = "=0.45.5", default-features = false, features = ["std", "nip44", "os-rng"] }
getrandom = "0.4"
url = "2"
secp256k1 = { version = "0.33", default-features = false, features = ["std"] }
bech32 = "0.12"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
nix = { version = "0.31", features = ["user"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
buzz-credential-store = { path = "../credential-store" }
