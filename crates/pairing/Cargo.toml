[package]
name = "buzz-pairing"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Buzz NIP-AB device pairing protocol"

[dependencies]
nostr = { version = "0.45", features = ["nip44"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
rand = "0.10"
subtle = "2.6"
zeroize = "1.8"
percent-encoding = "2.3"
url = "2"
